source = "experimenter"
start = "2026-10-21T09:00:00"
end = "2026-10-21T14:00:00"
note = "Sleep deprivation: forced wake with exploration and movement, and the experimenter's hands going in and out of the Faraday cage. A different noise profile in this interval is expected."

