[[observations]]
date = "2026-10-30"
source = "experimenter"
note = "Open Ephys OEPS-6571 headstage, third-generation acquisition board. Reference and ground are shorted together and tied to a cerebellar skull screw, so what the screw picks up appears on all 64 channels."

[[observations]]
