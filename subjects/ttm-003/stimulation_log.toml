# Hand log of the optogenetic stimulation trains, as recorded by Graham Findlay
# (2026-10-21) for the two TTM-003 sessions of 2026-10-16. Trains are listed in
# the order delivered; `approx_time` is the experimenter's estimate from the
# start of the recording. `scripts/stim_trains.py` joins these entries, in
# order, with the laser TTL (line 1 of the acquisition-board TTL events) and
# writes results/stimulation_trains.csv with the measured onsets and pulse
# parameters.

[patterns.A]
description = "200 ms laser on, 1 pulse/s, for 120 s"
pulse_ms = 200
rate_hz = 1
duration_s = 120

[patterns.B]
description = "50 ms laser on, 3 pulses/s, for 120 s"
pulse_ms = 50
rate_hz = 3
duration_s = 120

[sessions."2026-10-16_14-06-44"]
experiment = "TTM-003-OPTO1"
trains = [
