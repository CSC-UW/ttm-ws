[project]
name = "ttm"
version = "0.1.0"
description = "Open Ephys tetrode loading, LFP, spike sorting, tracking, and SWA utilities"
readme = "README.md"
authors = [
    { name = "Graham Findlay", email = "gfindlay@wisc.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "open-ephys-python-tools>=1.0.1",
    "dask",
    "numpy",
    "pandas",
    "xarray",
    "probeinterface",
    "spikeinterface>=0.105.2",
    "zarr>=2.18",
]

# Sibling and forked packages are bare names here; the workspace root
# pyproject.toml pins each one. See docs/SETUP.md, "Pinned packages".
[project.optional-dependencies]
lossy_compression = [
    "wavpack-numcodecs",
]
sorting = [
    "mountainsort5>=0.5.9",
    "kilosort>=4.1.7",
]
analysis = [
    "ecephys",
    "matplotlib",
    "seaborn",
]
curation = [
    "spikeinterface-gui[desktop,web]>=0.14.0",
]
viz = [
    "loupe",
]
advisory = [
    "scikit-learn",
    "huggingface-hub",
    "joblib",
]

[project.scripts]
ttm-convert = "ttm.cli.convert:main"
ttm-experiment-params = "ttm.cli.experiment_params:main"
ttm-make-lfp = "ttm.cli.make_lfp:main"
ttm-swa = "ttm.cli.swa:main"
ttm-emg = "ttm.cli.emg:main"
ttm-curation-manifest = "ttm.cli.curation:main_manifest"
ttm-curate = "ttm.cli.curation:main_curate"
ttm-viz-bundle = "ttm.cli.viz:main_build"
ttm-loupe = "ttm.cli.viz:main_loupe"
ttm-fetch-bundle = "ttm.cli.fetch:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
