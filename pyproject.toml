[project]
name = "ttm-ws"
version = "0.1.0"
description = "Tetrode (TTM) electrophysiology workspace: shared library, per-subject analyses, method investigations."
requires-python = ">=3.14"
dependencies = [
    "tetrode-analyses[analysis,sorting,curation,viz,advisory,lossy_compression]",
]

[tool.uv]
package = false
override-dependencies = [
    # spikeinterface requires zarr>=3 on Python 3.14 but refuses to WRITE zarr
    # with it; zarr 2 installs fine on 3.14 and keeps the Zarr converters working.
    "zarr>=2.18,<3",
    "numcodecs<0.16",
]
constraint-dependencies = [
    # Only 1.12.0 ships a cp314 wheel (kilosort -> faiss-cpu).
    "faiss-cpu==1.12.0",
    # Forces a CUDA-12 torch build; CUDA-13 wheels drop sm_70 (Tesla V100).
    "torch==2.9.1",
    # xarray 2026.9 dropped zarr 2 (its zarr backend passes zarr_format=);
    # 2026.7.0 is the newest release that reads and writes with the zarr override.
    "xarray<2026.8",
]

[tool.uv.workspace]
members = ["packages/*", "subjects/*"]

[tool.uv.sources]
tetrode-analyses = { workspace = true }
# Pinned by commit over HTTPS so a fresh clone resolves without credentials or
# sibling checkouts. To bump: edit rev, `uv lock --upgrade-package NAME`.
# To hack on one locally for a session: `uv pip install -e ../NAME`.
ecephys            = { git = "https://github.com/CSC-UW/ecephys.git",                 rev = "88e410e16d7762425c0f73870a0e4db0a6d8549c" }
loupe              = { git = "https://github.com/CSC-UW/loupe.git",                   rev = "bc33e3b150bcc508786ba7141861d257416abd62" }
kilosort           = { git = "https://github.com/grahamfindlay/Kilosort.git",         rev = "c5e98f3e1fa079ef35569c64bac0f64af661dcfc" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "ipykernel",
    "nbconvert",
]

[tool.pytest.ini_options]
# Explicit so collection never sweeps investigations/ (standalone drivers, not tests).
testpaths = ["packages/tetrode-analyses/tests"]
markers = [
    "requires_nfs: marks tests that require mounted production NFS data",
]
